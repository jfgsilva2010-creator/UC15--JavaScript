<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <h1 id="titulo"> Meu Planejador de Estudos</h1>

        <h2>Nova tarefa</h2>

        <input type="text" id="tarefa" placeholder=" Digite o nome da tarefa">

        <input type="text" id="materia" placeholder="Digite a materia">

       <select id="prioridade">
        <option value="">selecione a prioridade</option>
        <option value="baixa">baixa</option>
        <option value="media">media</option>
        <option value="alta">alta</option>
       </select>

       <button onclick="adicionarTarefa()">
        Cadastrar tarefa
       </button>

       <button onclick="limparCampos()">
        Limpar Campos
       </button>

       <p id="mensagem"></p>

       <div class="contadores">
        <p id="contador"> Tarefas cadastradas: 0</p>
        <p id="contadorConcluidas"> Tarefas concluidas: 0</p>
       </div>
        
       <button onclick="alternarModo()">
        Modo de concentração
       </button>

       <h2>Minhas tarefas</h2>
      <div id="listatarefas"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
